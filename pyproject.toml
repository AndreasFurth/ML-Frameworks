[project]
name = "ml-frameworks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AndreasFurth", email = "andreas@nevermindmedia.se" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.31.0",
    "matplotlib>=3.9.4",
    "numpy<2",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    # ML Core (pinned properly)
    "torch==2.2.2",
    "torchvision==0.17.2",
    "pytorch-lightning>=2.6.1",
    # ONNX stack
    "onnx==1.16.0",
    "ml-dtypes>=0.3.2",
    "onnxruntime>=1.24.2",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
